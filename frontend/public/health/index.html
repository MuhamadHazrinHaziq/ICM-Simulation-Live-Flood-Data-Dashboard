<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood Live Data API — Health Check</title>
  <link rel="icon" type="image/png" href="../Bimage-mark.png" />
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      font-weight: 600;
      font-size: 13px;
    }
    .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
    pre {
      background: #0a0e1a;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 8px;
      font-size: 13px;
      color: #38bdf8;
      overflow-x: auto;
      margin-top: 16px;
    }
    a { color: #38bdf8; text-decoration: none; font-size: 13px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0; font-size: 18px;">API Health Status</h2>
      <div class="status-badge"><span class="dot"></span> Healthy</div>
    </div>
    <pre id="json-output">{
  "status": "healthy",
  "service": "Flood Live Data API",
  "version": "1.0.0",
  "deployment": "GitHub Pages Preview",
  "watcher_running": true,
  "scheduler_running": true
}</pre>
    <div style="margin-top: 20px; display: flex; justify-content: space-between;">
      <a href="../">← Back to Dashboard</a>
      <a href="../docs/">View API Docs →</a>
    </div>
  </div>
</body>
</html>
