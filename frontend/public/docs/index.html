<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood Live Data API — Documentation</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="../Bimage-mark.png" />
  <link rel="apple-touch-icon" href="../Bimage-mark.png" />
  <link rel="alternate icon" href="../favicon.ico" />
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui { color: #e2e8f0; }
    .swagger-ui .info .title { color: #f8fafc; }
    .swagger-ui .info p, .swagger-ui .info li { color: #94a3b8; }
    .swagger-ui .scheme-container { background: #131b2e; box-shadow: none; border-bottom: 1px solid #1e293b; }
    .swagger-ui select { background: #0f172a; color: #f8fafc; border: 1px solid #334155; }
    .swagger-ui .opblock .opblock-summary-operation-id, .swagger-ui .opblock .opblock-summary-path, .swagger-ui .opblock .opblock-summary-path__deprecated { color: #f8fafc; }
    .swagger-ui .opblock .opblock-summary-description { color: #94a3b8; }
    .banner {
      background: #1e293b;
      color: #94a3b8;
      padding: 10px 20px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .banner a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    .banner a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="banner">
    <span>🌊 <strong>FloodCast API Documentation</strong> (OpenAPI 3.1 Specification)</span>
    <a href="../">← Back to Dashboard</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "../openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
